name: secret-scan

on:
  push:
    branches: [main, "upstream-sync-*"]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action calls GET /repos/{owner}/{repo}/pulls/{n}/commits on
    # pull_request events; the default GITHUB_TOKEN on a private repo
    # lacks `pull-requests: read` and the call returns 403. Grant the
    # minimum set explicitly so the action can enumerate PR commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
